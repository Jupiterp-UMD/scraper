# Unit tests, plus the cross-repository name-fixture parity check.
#
# The parity check is the point of running this on every push. The three
# implementations of normalize_name (SQL here, Python here, TypeScript in the
# site repository) are only as consistent as the fixture set they share, and
# the site's copy lives behind a repository boundary where nothing was
# comparing it. A drift produces duplicate instructor records and, once
# professor pages are indexed, permanently broken URLs.
name: Tests

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.11'

            -   name: Setup Python dependencies
                run: |
                    python3 -m pip install -r requirements-dev.txt

            -   name: Unit tests
                run: python3 -m pytest tests/ -q

            -   name: Name fixtures agree with the site repository
                run: python3 scripts/check_fixture_parity.py --url
